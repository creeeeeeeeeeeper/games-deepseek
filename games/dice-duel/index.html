<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>骰子对决 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🎲 骰子对决</h1>
      <p class="game-desc">每次各掷两颗骰子，点数大的一方赢得本局，五局三胜！</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">你 <strong id="you">0</strong></div>
        <div class="hud-item">局 <strong id="round">1/5</strong></div>
        <div class="hud-item">AI <strong id="ai">0</strong></div>
      </div>
      <div class="board-wrap"><canvas id="game" width="480" height="300" aria-label="骰子对决画面"></canvas></div>
      <button class="btn" id="rollBtn" type="button">🎲 掷骰子</button>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="hint">点击掷骰，谁点数大谁赢这一局，先到 3 局获胜。按 <kbd>R</kbd> 重开。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🏆 你赢了！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一场</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
