<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>六角棋 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">⬡ 六角棋</h1>
      <p class="game-desc">经典 Hex：双方轮流下子，你连通上下两边、AI 连通左右两边即胜。抢占中心，把对手的路堵死。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">你 <strong id="you">0</strong></div>
        <div class="hud-item">回合 <strong id="turn">你</strong></div>
        <div class="hud-item">AI <strong id="ai">0</strong></div>
      </div>
      <div class="board-wrap">
        <canvas id="canvas" width="440" height="440"></canvas>
      </div>
      <div class="msg" id="msg" aria-live="polite">点击空白六边形下子（你=◯，AI=◯ 上色）。</div>
      <div class="hint">你连上层边到下层边（竖向）；AI 连左到右（横向）。先连成即胜。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle"></h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
