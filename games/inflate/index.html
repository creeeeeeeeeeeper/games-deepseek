<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>软糖充气 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🍬 软糖充气</h1>
      <p class="game-desc">按住给软糖充气变大、松开变小，一边往上钻一边挤过越来越窄的缺口！</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">距离 <strong id="score">0m</strong></div>
        <div class="hud-item">体积 <strong id="size">0%</strong></div>
        <div class="hud-item">生命 <strong id="lives">❤❤❤</strong></div>
        <div class="hud-item">最高 <strong id="best">0m</strong></div>
      </div>

      <div class="board-wrap">
        <canvas id="game" width="480" height="640" aria-label="软糖充气游戏画面"></canvas>
      </div>

      <div class="hint">
        按住（鼠标 / 手指 / <kbd>空格</kbd>）充气变大，松开缩小；
        用左右移动避开墙壁，让体积刚好能穿过缺口。撞墙扣 1 命。按 <kbd>R</kbd> 重开。
      </div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">💥 挤爆了！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一趟</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
