<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时机捕手 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🎯 时机捕手</h1>
      <p class="game-desc">游标左右扫，绿区位置随时变——趁它扫进绿区的那一瞬间按下定格！</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">回合 <strong id="round">1/10</strong></div>
        <div class="hud-item">本轮 <strong id="hit">0</strong></div>
        <div class="hud-item">总分 <strong id="score">0</strong></div>
        <div class="hud-item">最高 <strong id="best">0</strong></div>
      </div>

      <div class="board-wrap">
        <canvas id="game" width="480" height="260" aria-label="时机捕手游戏画面"></canvas>
      </div>

      <div class="hint">
        绿区每回合随机移动，游标来回扫。等到游标<b>在绿区里</b>时按下（鼠标 / 手指 / 空格），
        越准分越高（满分 100）。共 10 回合。按 <kbd>R</kbd> 重开。
      </div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🎯 十回合打完！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来十回合</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
