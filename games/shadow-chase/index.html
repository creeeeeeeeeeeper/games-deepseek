<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>追光人 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🔦 追光人</h1>
      <p class="game-desc">移动手电光，趁萤火虫还没跑远把它们一个个点亮！</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">点亮 <strong id="score">0</strong></div>
        <div class="hud-item">时间 <strong id="time">45</strong></div>
        <div class="hud-item">连击 <strong id="combo">0</strong></div>
        <div class="hud-item">最高 <strong id="best">0</strong></div>
      </div>

      <div class="board-wrap">
        <canvas id="game" width="480" height="520" aria-label="追光人游戏画面"></canvas>
      </div>

      <div class="hint">
        移动鼠标 / 手指，手电光会跟着你；当光罩到萤火虫（在光圈内）就点亮 +1。
        萤火虫会逃，追得越快点亮越多。限时 45 秒。按 <kbd>R</kbd> 重开。
      </div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🔦 时间到！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再追一轮</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
