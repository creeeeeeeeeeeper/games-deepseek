<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灭灯 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">💡 灭灯</h1>
      <p class="game-desc">点一个格子，它和上下左右四个格子一起翻转明暗；想办法把所有灯都熄灭。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">步数 <strong id="moves">0</strong></div>
        <div class="hud-item">亮灯 <strong id="lit">0</strong></div>
      </div>
      <div class="board-wrap">
        <div class="grid" id="grid"></div>
      </div>
      <div class="msg" id="msg" aria-live="polite">点击格子翻转交叉状的灯。</div>
      <div class="hint">每点一下，该格与上下左右四格同时明暗翻转。把所有灯熄灭即通关。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🎉 灭灯成功</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
