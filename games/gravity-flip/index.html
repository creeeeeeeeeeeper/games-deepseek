<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重力翻面 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🪐 重力翻面</h1>
      <p class="game-desc">点按翻转重力，让方块贴着"有缺口的那一侧"过每一道闸门！</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">距离 <strong id="score">0m</strong></div>
        <div class="hud-item">重力 <strong id="gv">↓</strong></div>
        <div class="hud-item">生命 <strong id="lives">❤❤❤</strong></div>
        <div class="hud-item">最高 <strong id="best">0m</strong></div>
      </div>

      <div class="board-wrap">
        <canvas id="game" width="480" height="640" aria-label="重力翻面游戏画面"></canvas>
      </div>

      <div class="hint">
        点按 / 空格<b>翻转重力</b>（贴着上沿或下沿）。闸门要你贴着<b>有缺口的一侧</b>通过，
        贴错就撞上。撞墙扣 1 命。按 <kbd>R</kbd> 重开。
      </div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">💥 撞上了！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一遍</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
