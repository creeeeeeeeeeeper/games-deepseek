<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记忆翻牌 · 小游戏大全</title>
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🎴 记忆翻牌</h1>
      <p class="game-desc">翻开两张牌找配对，考验记忆力；步数越少越好！</p>
    </div>

    <div class="game-card">
      <div class="hud">
        <div class="hud-item">步数 <strong id="moves">0</strong></div>
        <div class="hud-item">配对 <strong id="pairs">0/8</strong></div>
        <div class="hud-item">用时 <strong id="time">0:00</strong></div>
        <div class="hud-item">最佳步数 <strong id="best">--</strong></div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>

      <div class="msg" id="msg" aria-live="polite"></div>

      <div class="hint">
        点击卡牌翻开，找出两张相同的图案即可配对消除。
        翻开超过两张时前两张会自动盖回。按 <kbd>R</kbd> 重新开始。
      </div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🎉 全部配对成功！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>


</body>
</html>
