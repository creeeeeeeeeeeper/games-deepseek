<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>尼姆博弈 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🧮 尼姆博弈</h1>
      <p class="game-desc">从若干堆火柴里轮流取，每次只能取一堆中的若干根；取到最后一根的人算输。和 AI 斗智。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">回合 <strong id="turn">你</strong></div>
        <div class="hud-item">当前 <strong id="last">—</strong></div>
      </div>
      <div class="board-wrap">
        <div class="nim-wrap" id="wrap"></div>
      </div>
      <div class="controls">
        <button class="btn secondary" id="addBtn" type="button">➕ 加一堆</button>
        <button class="btn secondary" id="resetBtn" type="button">重新开局</button>
      </div>
      <div class="msg" id="msg" aria-live="polite">点击一堆里的火柴来取。</div>
      <div class="hint">你取一个数，AI 接着取。谁被迫取走最后一根就输。想赢吗？想好后告诉我。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle"></h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
