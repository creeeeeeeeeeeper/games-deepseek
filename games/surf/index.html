<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冲浪高手 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🏄 冲浪高手</h1>
      <p class="game-desc">站在浪尖上保持平衡，左右移动躲开礁石；浪越长、翻滚越多分越高。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">分数 <strong id="score">0</strong></div>
        <div class="hud-item">连击 <strong id="combo">0</strong></div>
        <div class="hud-item">最高 <strong id="best">0</strong></div>
      </div>
      <div class="board-wrap">
        <canvas id="canvas" width="360" height="520"></canvas>
      </div>
      <div class="msg" id="msg" aria-live="polite">← / → 保持平衡，穿越浪谷加分。</div>
      <div class="hint">浪峰会左右摆动，你也要跟着移动；站不稳翻浪就结束。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🌊 翻浪了</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
