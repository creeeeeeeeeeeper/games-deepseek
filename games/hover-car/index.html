<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悬浮赛车 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🛸 悬浮赛车</h1>
      <p class="game-desc">驾驶悬浮车在车道间穿梭，躲开迎面而来的人和障碍；加速冲到最后，跑得越远分越高。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">距离 <strong id="dist">0</strong></div>
        <div class="hud-item">速度 <strong id="speed">0</strong></div>
        <div class="hud-item">最高 <strong id="best">0</strong></div>
      </div>
      <div class="board-wrap">
        <canvas id="canvas" width="360" height="520"></canvas>
      </div>
      <div class="msg" id="msg" aria-live="polite">← / → 变道，躲车。</div>
      <div class="hint">三车道；上下左右移动躲开障碍，持续加速。按 <kbd>R</kbd> 重开。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">💥 撞车了</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
