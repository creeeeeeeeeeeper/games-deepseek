<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>攀岩 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🧗 攀岩</h1>
      <p class="game-desc">手脚并用向上攀爬，够到一个个岩点；错过太多就失手坠落。爬得越高，得分越多。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">高度 <strong id="height">0</strong></div>
        <div class="hud-item">最高 <strong id="best">0</strong></div>
      </div>
      <div class="board-wrap">
        <canvas id="canvas" width="360" height="520"></canvas>
      </div>
      <div class="msg" id="msg" aria-live="polite">点击屏幕让攀岩者够向岩点。</div>
      <div class="hint">岩点会不断浮现；你点击某个岩点，攀岩者就朝它伸手。抓住一系列岩点向上爬，抓空会下降。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">💨 坠落</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
