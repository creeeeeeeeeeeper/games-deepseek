<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 涂鸦跳跃 · 小游戏大全</title>
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <div class="game-title">🎮 涂鸦跳跃</div>
    </div>
    <p class="game-desc">小怪自动弹跳，左右移动踩着平台一路向上！小心一踩就碎的棕色平台，抓住橙色弹簧能飞得更高。掉出屏幕底部就失败，高度就是分数。</p>
    <div class="game-card">
      <div class="hud">
        <div class="hud-item">当前高度 <strong id="score">0</strong></div>
        <div class="hud-item">最高纪录 <strong id="best">0</strong></div>
        <button class="btn secondary" id="restartBtn">🔄 重开一局</button>
      </div>
      <div class="board-wrap" id="boardWrap">
        <canvas id="game" width="400" height="700"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="hint">
        <kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd> 移动 · 穿过屏幕两侧可绕行 · <kbd>R</kbd> 重开 · 触屏按住左 / 右半屏
      </div>
      <div class="msg win" id="msg" hidden></div>
    </div>
    <div class="modal" id="modal">
      <div class="modal-box">
        <div class="modal-title" id="modalTitle">💀 掉下去啦！</div>
        <div class="modal-sub" id="modalSub"></div>
        <button class="btn" id="againBtn">再来一局</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>


</body>
</html>
