<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽乌龟 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🐢 抽乌龟</h1>
      <p class="game-desc">去掉一张"乌龟"牌后发牌，互相抽牌配对；谁手里最后剩下乌龟谁就输。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">你手里 <strong id="myCount">0</strong></div>
        <div class="hud-item">AI 手里 <strong id="aiCount">0</strong></div>
        <div class="hud-item">回合 <strong id="turn">你</strong></div>
      </div>
      <div class="board-wrap">
        <div class="hand-row">
          <div class="hand-col"><span class="hand-label">🖐️ 我的手牌</span><div class="hand" id="myHand"></div></div>
          <div class="hand-col"><span class="hand-label">🤖 AI 的手牌</span><div class="hand fan" id="aiHand"></div></div>
        </div>
      </div>
      <div class="msg" id="msg" aria-live="polite">点击 AI 手牌中的一张来抽。</div>
      <div class="hint">抽到的牌若和你手里某张点数相同就配对打出；无法配对的会留在手里。AI 也会来抽你的牌。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle"></h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
