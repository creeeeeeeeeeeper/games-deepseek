<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加倍挑战 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">💸 加倍挑战</h1>
      <p class="game-desc">掷出 4-6 让奖池翻倍、1-3 直接清空；见好就收，12 轮看谁攒得多。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">轮 <strong id="round">1/12</strong></div>
        <div class="hud-item">奖池 <strong id="pot">10</strong></div>
        <div class="hud-item">成绩 <strong id="score">0</strong></div>
        <div class="hud-item">最高 <strong id="best">0</strong></div>
      </div>
      <div class="board-wrap"><canvas id="game" width="480" height="180" aria-label="加倍挑战画面"></canvas></div>
      <div class="controls">
        <button class="btn" id="goBtn" type="button">🎲 继续（赌翻倍）</button>
        <button class="btn secondary" id="bankBtn" type="button">💰 收手入袋</button>
      </div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="hint">每轮奖池从 10 起；4-6 翻倍，1-3 清空并进入下一轮。按 <kbd>R</kbd> 重开。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">💸 十二轮结束</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来十二轮</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
