<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找集合 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🃏 找集合</h1>
      <p class="game-desc">经典 Set 卡牌游戏：找出三张卡，它们每种属性要么全相同、要么全不同。找满所有集合即过关。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">已找 <strong id="found">0</strong></div>
        <div class="hud-item">卡数 <strong id="count">0</strong></div>
      </div>
      <div class="board-wrap">
        <div class="cards" id="cards"></div>
      </div>
      <div class="msg" id="msg" aria-live="polite">点击选择三张卡（可顺序任意），每次点随时看状态。</div>
      <div class="hint">每种卡有四个属性（数量/颜色/形状/填充）。找一组三张，四个属性各自全同或全异。（提示：桌上永远有解。）</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🎉 全部找齐！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
