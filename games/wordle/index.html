<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordle 猜词 · 小游戏大全</title>
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🟩 Wordle 猜词</h1>
      <p class="game-desc">六次机会猜出五个字母的单词！</p>
    </div>

    <div class="game-card">
      <div class="hud">
        <div class="hud-item">局数 <strong id="games">0</strong></div>
        <div class="hud-item">胜率 <strong id="winrate">--</strong></div>
        <div class="hud-item">连胜 <strong id="streak">0</strong></div>
        <button class="btn secondary" id="newBtn" type="button">新单词</button>
      </div>

      <div class="board" id="board" aria-label="Wordle 猜词棋盘"></div>

      <div class="msg" id="msg" aria-live="polite"></div>

      <div class="keys" id="keys"></div>

      <div class="legend">
        <span><i class="lg g"></i>位置正确</span>
        <span><i class="lg y"></i>包含但位置不对</span>
        <span><i class="lg x"></i>不含该字母</span>
      </div>

      <div class="hint">
        输入 5 个字母后按 <kbd>Enter</kbd> 提交。🟩 绿=位置正确 · 🟨 黄=字母对但位置错 · ⬛ 灰=不在词中。
      </div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🎉 猜对了！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">下一个单词</button>
    </div>
  </div>

  <script src="script.js"></script>


</body>
</html>
