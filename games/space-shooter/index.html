<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🚀 太空射击 · 小游戏大全</title>
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
</head>
<body>
  <main class="game-shell">
    <header class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🚀 太空射击</h1>
      <p class="game-desc">驾驶战机迎击敌机，坚持清完第 8 波即可通关；连击有额外加分，小心撞击与弹幕！</p>
    </header>

    <section class="game-card">
      <div class="hud">
        <div class="hud-item"><span>得分</span><strong id="hud-score">0</strong></div>
        <div class="hud-item"><span>护盾</span><strong id="hud-shield">❤❤❤</strong></div>
        <div class="hud-item"><span>波次</span><strong id="hud-wave">1/8</strong></div>
        <div class="hud-item"><span>最高分</span><strong id="hud-best">0</strong></div>
      </div>

      <div class="board-wrap">
        <canvas id="game" width="420" height="700" aria-label="太空射击游戏画面"></canvas>
      </div>

      <p class="hint">
        <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 移动 ·
        <kbd>空格</kbd> 射击（可按住连发）· 鼠标 / 触屏拖动瞄准并开火 ·
        <kbd>R</kbd> 重开
      </p>
    </section>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box">
        <h2 class="modal-title" id="modal-title">游戏结束</h2>
        <p class="msg" id="modal-msg"></p>
        <p class="modal-sub" id="modal-sub"></p>
        <button class="btn" id="btn-restart" type="button">再来一局</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>


</body>
</html>
