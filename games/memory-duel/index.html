<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记忆对战 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🧠 记忆对战</h1>
      <p class="game-desc">翻卡配对，你和 AI 轮流翻两张，配成一对就得分并再翻；谁配对多谁赢。</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">你 <strong id="you">0</strong></div>
        <div class="hud-item">回合 <strong id="turn">你</strong></div>
        <div class="hud-item">AI <strong id="ai">0</strong></div>
      </div>
      <div class="board-wrap">
        <div class="cards" id="cards"></div>
      </div>
      <div class="msg" id="msg" aria-live="polite">点击两张卡翻牌，配对得分。</div>
      <div class="hint">翻开的卡会短暂显示；记住位置，配成对得1分并继续翻。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle"></h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
