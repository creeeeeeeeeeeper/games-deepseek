<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五子棋 · 小游戏大全</title>
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">⚫ 五子棋</h1>
      <p class="game-desc">15×15 棋盘，五子连珠即胜！可挑战 AI 或与好友对弈。</p>
    </div>

    <div class="game-card">
      <!-- 单双人切换 -->
      <div class="mode-switch" role="tablist" aria-label="游戏模式">
        <button type="button" class="mode-btn is-on" data-mode="ai" aria-selected="true">🤖 单人 · 对战 AI</button>
        <button type="button" class="mode-btn" data-mode="pvp" aria-selected="false">👥 双人 · 同屏轮流</button>
      </div>

      <div class="hud">
        <div class="hud-item">回合 <strong id="turn" class="b">黑方</strong></div>
        <div class="hud-item"><span id="lblA">你</span>(黑) 胜 <strong id="scoreA">0</strong></div>
        <div class="hud-item"><span id="lblB">AI</span>(白) 胜 <strong id="scoreB">0</strong></div>
        <button class="btn secondary" id="restart" type="button">重新开始</button>
      </div>

      <div class="board-wrap">
        <canvas id="board" width="600" height="600" aria-label="五子棋棋盘"></canvas>
      </div>

      <div class="msg" id="msg" aria-live="polite"></div>

      <div class="hint">
        点击棋盘交叉点落子，先连成五子（横 / 竖 / 斜）者胜。
        按 <kbd>R</kbd> 重新开始。
      </div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🎉 获胜！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>


</body>
</html>
