<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抢10 · 小游戏大全</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a class="back-btn" href="../../index.html">← 返回列表</a>
      <h1 class="game-title">🔟 抢10</h1>
      <p class="game-desc">1-9 轮流挑一个，谁先凑出「正好 10」的某几个数谁赢——AI 会抢你需要的数！</p>
    </div>

    <div class="game-card center">
      <div class="hud">
        <div class="hud-item">回合 <strong id="turn">你</strong></div>
        <div class="hud-item">你的数 <strong id="youSet">—</strong></div>
        <div class="hud-item">AI 的数 <strong id="aiSet">—</strong></div>
      </div>
      <div class="board" id="board"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="hint">例如你拿了 4 和 6 就算凑成 10 立刻获胜。AI 每步会优先「自己赢」，其次「抢走你需要的数」。按 <kbd>R</kbd> 重开。</div>
    </div>
  </div>

  <div class="modal" id="endModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 class="modal-title" id="endTitle">🔟 你赢了！</h2>
      <p class="modal-sub" id="endMsg"></p>
      <button class="btn" id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
